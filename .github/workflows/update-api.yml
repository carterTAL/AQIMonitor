name: Update AQI Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify API Key
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: |
          if [ -z "$AIRNOW_API_KEY" ]; then
            echo "AIRNOW_API_KEY secret is missing."
            exit 1
          fi

      - name: Update Cache
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: |
          node scripts/update-aqi.js

      - name: Commit Cache Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          git add cache/aqi-cache.json
      
          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update AQI cache"
      
            git pull --rebase origin main
      
            git push origin HEAD:main
          fi
