name: Update AQI cache

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-aqi-cache
  cancel-in-progress: false

jobs:
  update-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify API key
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: |
          if [ -z "$AIRNOW_API_KEY" ]; then
            echo "AIRNOW_API_KEY is missing or empty."
            exit 1
          fi

      - name: Update AQI cache
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: node scripts/update-aqi.js

      - name: Validate generated cache
        run: |
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("cache/aqi-cache.json","utf8"));if(!Array.isArray(c.locations)||c.locations.length!==30)throw new Error("Expected 30 locations");console.log(`Cache valid: ${c.reporting}/30 reporting`);'

      - name: Commit cache safely
        shell: bash
        run: |
          set -euo pipefail

          cp cache/aqi-cache.json /tmp/aqi-cache.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/aqi-cache.json cache/aqi-cache.json
            git add cache/aqi-cache.json

            if git diff --cached --quiet; then
              echo "No cache changes detected."
              exit 0
            fi

            git commit -m "Update AQI cache"

            if git push origin HEAD:main; then
              echo "AQI cache pushed successfully."
              exit 0
            fi

            echo "Remote changed during push; retrying from latest main."
          done

          echo "Unable to push AQI cache after 3 attempts."
          exit 1
