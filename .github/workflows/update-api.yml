name: Update AQI cache
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: update-aqi-cache
  cancel-in-progress: false
jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Verify API secret
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: |
          if [ -z "$AIRNOW_API_KEY" ]; then echo "AIRNOW_API_KEY is missing or empty"; exit 1; fi
      - name: Update cache
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: node scripts/update-aqi.js
      - name: Validate cache
        run: node -e 'const c=require("./cache/aqi-cache.json");if(!Array.isArray(c.locations)||c.locations.length!==30)throw Error("Expected 30 locations");console.log(`Valid cache: ${c.reporting}/30 reporting`)'
      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/aqi-cache.json
          git diff --cached --quiet || git commit -m "Update AQI cache"
          git pull --rebase
          git push
