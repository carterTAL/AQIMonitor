name: Update AQI cache
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
permissions:
  contents: write
concurrency:
  group: update-aqi-cache
  cancel-in-progress: false
jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Update AQI cache
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: node scripts/update-aqi.js
      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/aqi-cache.json
          if git diff --cached --quiet; then
            echo "No cache changes."
          else
            git commit -m "Update AQI cache"
            git pull --rebase
            git push
          fi
