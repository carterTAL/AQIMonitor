<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AQI Monitoring Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px;font:14px Arial,sans-serif;background:#f1f5f9;color:#0f172a}header,.controls,.summary{display:flex;gap:12px;flex-wrap:wrap;align-items:center}header{justify-content:space-between;margin-bottom:18px}h1{margin:0}.sub,.muted{color:#64748b}.controls input,.controls button,select,#search{padding:11px;border:1px solid #cbd5e1;border-radius:9px}button{background:#2563eb;color:#fff;border:0!important;font-weight:700;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}.stat,.toolbar,.place{background:#fff;border-radius:12px;box-shadow:0 2px 8px #0f172a10}.stat{padding:16px}.stat b{display:block;font-size:28px;margin-top:5px}.toolbar{display:flex;gap:10px;padding:14px;margin-bottom:16px;flex-wrap:wrap}#search{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:15px}.place{overflow:hidden}.bar{height:8px}.inside{padding:16px}.top{display:flex;justify-content:space-between;gap:8px}.division{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#2563eb;margin-bottom:6px}.title{font-size:20px;font-weight:800}.badge{background:#dbeafe;color:#1e40af;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;height:max-content;white-space:nowrap}.aqi{font-size:48px;font-weight:800;margin:12px 0 3px}.category{font-weight:700}.rows{border-top:1px solid #e2e8f0;margin-top:14px;padding-top:10px}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0;font-size:13px}.row span:last-child{text-align:right;font-weight:700}.good{background:#00e400}.moderate{background:#ffff00}.sensitive{background:#ff7e00}.unhealthy{background:#ff0000}.very{background:#8f3f97}.hazardous{background:#7e0023}.unknown{background:#94a3b8}.notice{display:none;background:#fff7ed;color:#9a3412;border:1px solid #fdba74;padding:12px;border-radius:10px;margin-bottom:14px}footer{text-align:center;color:#64748b;margin-top:22px;font-size:12px}
</style></head><body><header><div><h1>Multi-Location AQI Dashboard</h1><div class="sub">Live AirNow monitoring across ID, MT, OR, and WA</div></div><div class="controls"><input id="apiKey" type="password" placeholder="AirNow API key"><button id="refresh" type="button">Refresh All</button></div></header><div id="notice" class="notice"></div><section class="summary"><div class="stat">Locations<b id="total">30</b></div><div class="stat">Reporting<b id="reporting">0</b></div><div class="stat">AQI above 100<b id="elevated">0</b></div><div class="stat">Last updated<div id="updated" class="muted" style="margin-top:10px">Never</div></div></section><section class="toolbar"><input id="search" placeholder="Search division, city, state, or ZIP"><select id="divisionFilter"><option value="ALL">All divisions</option></select><select id="state"><option value="ALL">All states</option><option>ID</option><option>MT</option><option>OR</option><option>WA</option></select><select id="sort"><option value="worst">Worst AQI first</option><option value="best">Best AQI first</option><option value="name">City name</option><option value="division">Division name</option></select></section><main id="grid" class="grid"></main><footer>Data source: U.S. EPA AirNow current observations. Standalone file with hourly refresh.</footer><script>
const locations=[["Badger Building Center", "Sagle", "ID", "83860", "Sandpoint Reporting Area"], ["Badger Building Center", "Post Falls", "ID", "83854", "Coeur d'Alene Reporting Area"], ["Badger Building Center", "Kalispell", "MT", "59901", ""], ["Badger Building Center", "Bonners Ferry", "ID", "83805", ""], ["Elma Building Center", "Elma", "WA", "98541", ""], ["Beaverhead Building Center", "Dillon", "MT", "59725", ""], ["Best Built Builders Supply", "Orofino", "ID", "83544", "Nez Perce Reservation"], ["Best Built Builders Supply", "Grangeville", "ID", "83530", "Grangeville Reporting Area"], ["Best Built Builders Supply", "Kamiah", "ID", "83536", ""], ["Best Built Builders Supply", "Lewiston", "ID", "83501", "Lewiston Reporting Area"], ["Browne's Home Center", "Friday Harbor", "WA", "98250", ""], ["Ennis Building Center", "Ennis", "MT", "59729", "Bozeman EBAM Monitor"], ["Gerretsen Building Supply", "Roseburg", "OR", "97470", ""], ["Harbor Rental and Saw", "Friday Harbor", "WA", "98250", ""], ["Lake Chelan Building Supply", "Chelan", "WA", "98816", "Chelan Reporting Area"], ["Lake Chelan Building Supply", "Manson", "WA", "98831", "Chelan Reporting Area"], ["Marson and Marson Lumber", "Leavenworth", "WA", "98826", "Leavenworth Reporting Area"], ["Marson and Marson Lumber", "Wenatchee", "WA", "98801", ""], ["Marson and Marson Lumber", "Cle Elum", "WA", "98922", ""], ["Marson and Marson Lumber", "Ephrata", "WA", "98823", ""], ["Midway Building Supply", "Tonasket", "WA", "98855", ""], ["Midway Building Supply", "Republic", "WA", "99166", "Republic Monitor"], ["Midway Building Supply", "Oroville", "WA", "98844", "Tonasket Monitor"], ["Miller's Home Center", "Baker City", "OR", "97814", ""], ["Miller's Home Center", "La Grande", "OR", "97850", ""], ["Mount Vernon Building Center", "Mount Vernon", "WA", "98273", ""], ["TAL Support Center", "Vancouver", "WA", "98684", ""], ["Tum-A-Lum Lumber", "Hood River", "OR", "97031", ""], ["Tum-A-Lum Lumber", "The Dalles", "OR", "97058", ""], ["Tum-A-Lum Lumber", "Pendleton", "OR", "97801", ""]].map(([division,city,state,zip,preferredReportingArea])=>({division,city,state,zip,preferredReportingArea,aqi:null,category:'Not loaded',pollutant:'—',reportingArea:'—',lastUpdated:null}));let readings=[...locations];const $=id=>document.getElementById(id);const field=(x,...n)=>{for(const k of n)if(x?.[k]!=null&&x[k]!=="")return x[k];return null};const norm=x=>String(x||'').toLowerCase().replace(/reporting area|monitor/g,'').replace(/[^a-z0-9]+/g,' ').trim();const aqiOf=x=>{for(const v of[x?.nowcastAQI,x?.NowcastAQI,x?.AQI,x?.aqi]){const n=Number(v);if(Number.isFinite(n))return n}return null};const listOf=x=>Array.isArray(x)?x:Array.isArray(x?.data)?x.data:Array.isArray(x?.results)?x.results:[];function color(a){return a==null?'unknown':a<=50?'good':a<=100?'moderate':a<=150?'sensitive':a<=200?'unhealthy':a<=300?'very':'hazardous'}
async function getAQI(loc,key){const params=new URLSearchParams({format:'application/json',zipCode:loc.zip,distance:'50',API_KEY:key});const response=await fetch(`https://www.airnowapi.org/aq/observation/current/ziplatlong/?${params}`);if(!response.ok)throw new Error(`HTTP ${response.status}`);const all=listOf(await response.json()),preferred=norm(loc.preferredReportingArea),matches=preferred?all.filter(x=>{const a=norm(field(x,'reportingArea','ReportingArea','reportingAreaName','ReportingAreaName','siteName','SiteName'));return a===preferred||a.includes(preferred)||preferred.includes(a)}):all,item=[...(matches.length?matches:all)].sort((a,b)=>(aqiOf(b)??-1)-(aqiOf(a)??-1))[0],lastUpdated=new Date().toLocaleString();if(!item)return{...loc,lastUpdated,category:'Unavailable',error:'No current observation returned'};const co=field(item,'category','Category'),category=co&&typeof co==='object'?(co.name||co.Name):co;return{...loc,aqi:aqiOf(item),category:category||field(item,'categoryName','CategoryName')||'Observation available',pollutant:field(item,'parameterName','ParameterName','pollutant','Pollutant')||'—',reportingArea:field(item,'reportingArea','ReportingArea','reportingAreaName','ReportingAreaName','siteName','SiteName')||loc.preferredReportingArea||'—',lastUpdated,error:matches.length||!preferred?null:'Preferred source not found; nearest ZIP result shown'}}
function render(){const q=$('search').value.toLowerCase().trim(),st=$('state').value,div=$('divisionFilter').value,sort=$('sort').value;let data=readings.filter(x=>(st==='ALL'||x.state===st)&&(div==='ALL'||x.division===div)&&(!q||`${x.division} ${x.city} ${x.state} ${x.zip}`.toLowerCase().includes(q)));data.sort((a,b)=>sort==='division'?(a.division.localeCompare(b.division)||a.city.localeCompare(b.city)):sort==='name'?a.city.localeCompare(b.city):sort==='best'?(a.aqi??9999)-(b.aqi??9999):(b.aqi??-1)-(a.aqi??-1));$('grid').innerHTML=data.map(x=>`<article class="place"><div class="bar ${color(x.aqi)}"></div><div class="inside"><div class="top"><div><div class="division">${x.division}</div><div class="title">${x.city}, ${x.state}</div><div class="muted">ZIP ${x.zip}</div></div><span class="badge">Live observation</span></div><div class="aqi">${x.aqi??'—'}</div><div class="category">${x.category||'Unavailable'}</div><div class="rows"><div class="row"><span>Pollutant</span><span>${x.pollutant||'—'}</span></div><div class="row"><span>Reporting area / monitor</span><span>${x.reportingArea||x.preferredReportingArea||'—'}</span></div><div class="row"><span>Last cached / updated</span><span>${x.lastUpdated||'Not yet loaded'}</span></div>${x.error?`<div class="muted">${x.error}</div>`:''}</div></div></article>`).join('')||'<p>No locations match the filters.</p>'}
async function refresh(){const key=$('apiKey').value.trim();if(!key){$('notice').textContent='Enter an AirNow API key.';$('notice').style.display='block';return}$('notice').style.display='none';$('refresh').disabled=true;$('refresh').textContent='Updating...';const s=await Promise.allSettled(locations.map(x=>getAQI(x,key)));readings=s.map((r,i)=>r.status==='fulfilled'?r.value:{...locations[i],category:'Unavailable',lastUpdated:new Date().toLocaleString(),error:r.reason?.message||'Request failed'});$('reporting').textContent=readings.filter(x=>x.aqi!=null).length;$('elevated').textContent=readings.filter(x=>x.aqi>100).length;$('updated').textContent=new Date().toLocaleString();$('refresh').disabled=false;$('refresh').textContent='Refresh All';render()}
[...new Set(locations.map(x=>x.division))].sort((a,b)=>a.localeCompare(b)).forEach(d=>$('divisionFilter').add(new Option(d,d)));$('total').textContent=locations.length;$('refresh').onclick=refresh;$('search').oninput=render;$('divisionFilter').onchange=render;$('state').onchange=render;$('sort').onchange=render;const defaultKey='A29287E7-0FE7-473C-87DA-C15A1AE3BEC5',savedKey=localStorage.getItem('airNowApiKey');$('apiKey').value=savedKey||defaultKey;$('apiKey').addEventListener('change',()=>localStorage.setItem('airNowApiKey',$('apiKey').value.trim()));render();if($('apiKey').value.trim())refresh();setInterval(()=>{if($('apiKey').value.trim())refresh()},3600000);
</script></body></html>
