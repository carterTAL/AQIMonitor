<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AQI Monitoring Dashboard</title>
<style>*{box-sizing:border-box}body{margin:0;padding:20px;font:14px Arial,sans-serif;background:#f1f5f9;color:#0f172a}header,.summary{display:flex;gap:12px;flex-wrap:wrap;align-items:center}header{justify-content:space-between;margin-bottom:18px}h1{margin:0}.sub,.muted{color:#64748b}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}.stat,.toolbar,.place,.status{background:#fff;border-radius:12px;box-shadow:0 2px 8px #0f172a10}.stat{padding:16px}.stat b{display:block;font-size:28px;margin-top:5px}.toolbar{display:flex;gap:10px;padding:14px;margin-bottom:16px;flex-wrap:wrap}input,select,button{padding:11px;border:1px solid #cbd5e1;border-radius:9px}button{background:#2563eb;color:#fff;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.status{padding:12px;margin-bottom:14px}.status.ok{color:#166534;background:#f0fdf4}.status.warn{color:#9a3412;background:#fff7ed}.status.error{color:#991b1b;background:#fef2f2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}.place{overflow:hidden}.bar{height:8px}.inside{padding:16px}.top{display:flex;justify-content:space-between;gap:8px}.division{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#2563eb;margin-bottom:6px}.title{font-size:20px;font-weight:800}.badge{background:#dbeafe;color:#1e40af;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;height:max-content}.aqi{font-size:48px;font-weight:800;margin:12px 0 3px}.category{font-weight:700}.rows{border-top:1px solid #e2e8f0;margin-top:14px;padding-top:10px}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0;font-size:13px}.row span:last-child{text-align:right;font-weight:700}.good{background:#00e400}.moderate{background:#ffff00}.sensitive{background:#ff7e00}.unhealthy{background:#ff0000}.very{background:#8f3f97}.hazardous{background:#7e0023}.unknown{background:#94a3b8}footer{text-align:center;color:#64748b;margin-top:22px;font-size:12px}</style></head>
<body><header><div><h1>Multi-Location AQI Dashboard</h1><div class="sub">Hourly cached AirNow data</div></div><button id="reload" type="button">Reload Cache</button></header>
<div id="status" class="status warn">Loading cache…</div>
<section class="summary"><div class="stat">Locations<b id="total">0</b></div><div class="stat">Reporting<b id="reporting">0</b></div><div class="stat">AQI above 100<b id="elevated">0</b></div><div class="stat">Cache updated<div id="updated" class="muted" style="margin-top:10px">Never</div></div></section>
<section class="toolbar"><input id="search" placeholder="Search division, city, state, or ZIP"><select id="divisionFilter"><option value="ALL">All divisions</option></select><select id="state"><option value="ALL">All states</option><option>ID</option><option>MT</option><option>OR</option><option>WA</option></select><select id="sort"><option value="worst">Worst AQI first</option><option value="best">Best AQI first</option><option value="name">City name</option><option value="division">Division name</option></select></section>
<main id="grid" class="grid"></main><footer>Data source: U.S. EPA AirNow current observations. The repository cache is refreshed by GitHub Actions.</footer>
<script>
'use strict'; let readings=[]; const $=id=>document.getElementById(id); const cacheUrl=new URL('cache/aqi-cache.json',document.baseURI);
function color(a){return a==null?'unknown':a<=50?'good':a<=100?'moderate':a<=150?'sensitive':a<=200?'unhealthy':a<=300?'very':'hazardous'}
function fmt(v){if(!v)return 'Not yet loaded';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()}
function setStatus(message,kind){$('status').textContent=message;$('status').className='status '+kind}
function render(){const q=$('search').value.toLowerCase().trim(),st=$('state').value,div=$('divisionFilter').value,sort=$('sort').value;let data=readings.filter(x=>(st==='ALL'||x.state===st)&&(div==='ALL'||x.division===div)&&(!q||`${x.division} ${x.city} ${x.state} ${x.zip}`.toLowerCase().includes(q)));data.sort((a,b)=>sort==='division'?(a.division.localeCompare(b.division)||a.city.localeCompare(b.city)):sort==='name'?a.city.localeCompare(b.city):sort==='best'?(a.aqi??9999)-(b.aqi??9999):(b.aqi??-1)-(a.aqi??-1));$('grid').innerHTML=data.map(x=>`<article class="place"><div class="bar ${color(x.aqi)}"></div><div class="inside"><div class="top"><div><div class="division">${x.division}</div><div class="title">${x.city}, ${x.state}</div><div class="muted">ZIP ${x.zip}</div></div><span class="badge">Cached</span></div><div class="aqi">${x.aqi??'—'}</div><div class="category">${x.category||'Unavailable'}</div><div class="rows"><div class="row"><span>Pollutant</span><span>${x.pollutant||'—'}</span></div><div class="row"><span>Reporting area / monitor</span><span>${x.reportingArea||x.preferredReportingArea||'—'}</span></div><div class="row"><span>Last cached / updated</span><span>${fmt(x.lastUpdated)}</span></div>${x.error?`<div class="muted">${x.error}</div>`:''}</div></div></article>`).join('')||'<p>No locations match the filters.</p>'}
function rebuildDivisions(){const current=$('divisionFilter').value;$('divisionFilter').innerHTML='<option value="ALL">All divisions</option>';[...new Set(readings.map(x=>x.division).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).forEach(d=>$('divisionFilter').add(new Option(d,d)));if([...$('divisionFilter').options].some(o=>o.value===current))$('divisionFilter').value=current}
async function loadCache(){const button=$('reload');button.disabled=true;button.textContent='Loading…';setStatus(`Loading ${cacheUrl.pathname}…`,'warn');try{const request=new URL(cacheUrl);request.searchParams.set('v',Date.now());const response=await fetch(request,{cache:'no-store'});if(!response.ok)throw new Error(`Cache request returned HTTP ${response.status}`);const cache=await response.json();if(!cache||!Array.isArray(cache.locations))throw new Error('Cache JSON does not contain a locations array');readings=cache.locations;$('total').textContent=readings.length;$('reporting').textContent=Number.isFinite(Number(cache.reporting))?cache.reporting:readings.filter(x=>x.aqi!=null).length;$('elevated').textContent=Number.isFinite(Number(cache.elevated))?cache.elevated:readings.filter(x=>x.aqi>100).length;$('updated').textContent=fmt(cache.lastUpdated);rebuildDivisions();render();if(cache.lastUpdated)setStatus(`Loaded ${readings.length} locations. Cache updated ${fmt(cache.lastUpdated)}.`,'ok');else setStatus('The cache file loaded, but it has not been populated yet. Run the Update AQI cache workflow once.','warn')}catch(error){console.error('AQI cache load failed:',error);setStatus(`Unable to load ${cacheUrl.pathname}: ${error.message}. Confirm the cache file is committed at cache/aqi-cache.json and GitHub Pages is serving this branch.`,'error');$('grid').innerHTML='<div class="status error">AQI data could not be loaded.</div>'}finally{button.disabled=false;button.textContent='Reload Cache'}}
$('reload').addEventListener('click',loadCache);$('search').addEventListener('input',render);$('divisionFilter').addEventListener('change',render);$('state').addEventListener('change',render);$('sort').addEventListener('change',render);loadCache();
</script></body></html>
