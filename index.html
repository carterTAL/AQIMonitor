<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AQI Monitoring Dashboard</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;font:14px Arial,sans-serif;background:#f1f5f9;color:#0f172a}header,.summary{display:flex;gap:12px;flex-wrap:wrap;align-items:center}header{justify-content:space-between;margin-bottom:18px}h1{margin:0}.sub,.muted{color:#64748b}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}.stat,.toolbar,.place{background:#fff;border-radius:12px;box-shadow:0 2px 8px #0f172a10}.stat{padding:16px}.stat b{display:block;font-size:28px;margin-top:5px}.toolbar{display:flex;gap:10px;padding:14px;margin-bottom:16px;flex-wrap:wrap}input,select,button{padding:11px;border:1px solid #cbd5e1;border-radius:9px}button{background:#2563eb;color:#fff;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:15px}.inside{padding:16px}.division{font-size:12px;font-weight:700;color:#2563eb}.title{font-size:20px;font-weight:800}.row{display:flex;justify-content:space-between;margin:7px 0}.good{background:#00e400}.moderate{background:#ffff00}.sensitive{background:#ff7e00}.unhealthy{background:#ff0000}.very{background:#8f3f97}.hazardous{background:#7e0023}.unknown{background:#94a3b8}.bar{height:8px}</style></head><body><header><div><h1>Multi-Location AQI Dashboard</h1><div class="sub">Hourly cached AQI data from GitHub Pages</div></div><button onclick="loadCache()">Reload Cache</button></header><section class="summary"><div class="stat">Locations<b id="total">0</b></div><div class="stat">Reporting<b id="reporting">0</b></div><div class="stat">AQI above 100<b id="elevated">0</b></div><div class="stat">Last updated<div id="updated" class="muted">Never</div></div></section><section class="toolbar"><input id="search" placeholder="Search division, city, state, or ZIP"><select id="divisionFilter"><option value="ALL">All divisions</option></select><select id="state"><option value="ALL">All states</option><option>ID</option><option>MT</option><option>OR</option><option>WA</option></select><select id="sort"><option value="worst">Worst AQI first</option><option value="best">Best AQI first</option><option value="name">City name</option><option value="division">Division name</option></select></section><main id="grid" class="grid"></main><script>let readings=[];const $=id=>document.getElementById(id);function color(a){return a==null?'unknown':a<=50?'good':a<=100?'moderate':a<=150?'sensitive':a<=200?'unhealthy':a<=300?'very':'hazardous'}function render(){const q=$('search').value.toLowerCase().trim(),st=$('state').value,div=$('divisionFilter').value,sort=$('sort').value;let data=readings.filter(x=>(st==='ALL'||x.state===st)&&(div==='ALL'||x.division===div)&&(!q||`${x.division} ${x.city} ${x.state} ${x.zip}`.toLowerCase().includes(q)));data.sort((a,b)=>sort==='division'?(a.division.localeCompare(b.division)||a.city.localeCompare(b.city)):sort==='name'?a.city.localeCompare(b.city):sort==='best'?(a.aqi??9999)-(b.aqi??9999):(b.aqi??-1)-(a.aqi??-1));grid.innerHTML=data.map(x=>`<article class=place><div class='bar ${color(x.aqi)}'></div><div class=inside><div class=division>${x.division}</div><div class=title>${x.city}, ${x.state}</div><div>${x.aqi??'—'} AQI - ${x.category||''}</div><div class=row><span>Reporting Area</span><span>${x.reportingArea||'—'}</span></div><div class=row><span>Last Updated</span><span>${x.lastUpdated||'—'}</span></div></div></article>`).join('')}async function loadCache(){const r=await fetch('./cache/aqi-cache.json?t='+Date.now(),{cache:'no-store'});const c=await r.json();readings=c.locations||[];total.textContent=readings.length;reporting.textContent=c.reporting||0;elevated.textContent=c.elevated||0;updated.textContent=c.lastUpdated||'Unknown';const sel=divisionFilter;sel.innerHTML='<option value="ALL">All divisions</option>';[...new Set(readings.map(x=>x.division))].sort().forEach(d=>sel.add(new Option(d,d)));render()}search.oninput=render;divisionFilter.onchange=render;state.onchange=render;sort.onchange=render;loadCache();</script></body></html>
